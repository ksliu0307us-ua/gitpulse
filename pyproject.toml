[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gitpulse"
version = "0.1.0"
description = "A quick picture of your commit activity across local git repos"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Kevin Liu"}]

[project.scripts]
gitpulse = "gitpulse.cli:main"

[tool.setuptools.packages.find]
include = ["gitpulse*"]
